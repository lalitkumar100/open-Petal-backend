spring:
  application:
    name: open-petal-backend
  profiles:
    default: dev
  jackson:
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  debug:
    show-stacktrace: false
  messages:
    resource: classpath:messages/application-messages.csv
